name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_apply:
        description: "Run terraform apply (requires careful state handling)"
        required: false
        default: "false"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy IaC Scan (block CRITICAL)
        run: trivy config --severity CRITICAL --exit-code 1 .

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate

  plan_apply:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      TF_VAR_project_id: chas-devsecops-2026
      TF_VAR_region: europe-north1
      TF_VAR_zone: europe-north1-b
      TF_VAR_student_id: andre
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Prepare GCP credentials
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          raw = os.environ.get("GCP_SA_KEY", "")
          raw = raw.strip().strip('"').strip("'").strip("`")
          print(f"GCP_SA_KEY length: {len(raw)}")
          if raw:
              print(f"GCP_SA_KEY starts with: {raw[:1]!r}")
          if not raw:
              raise SystemExit("GCP_SA_KEY is empty (check Actions Secret/Variable name and value)")

          def validate_and_write(payload: str) -> None:
              data = json.loads(payload)
              if data.get("type") != "service_account":
                  raise SystemExit(f"Expected service_account key, got: {data.get('type')!r}")
              for required in ("type", "client_email", "private_key"):
                  if required not in data or not data[required]:
                      raise SystemExit(f"Missing required key in credentials JSON: {required}")
              if "\\n" in data["private_key"]:
                  data["private_key"] = data["private_key"].replace("\\n", "\n")
              if "\\r" in data["private_key"]:
                  data["private_key"] = data["private_key"].replace("\\r", "")
              data["private_key"] = data["private_key"].replace("\r", "").strip() + "\n"
              if (
                  ("BEGIN PRIVATE KEY" not in data["private_key"] and "BEGIN RSA PRIVATE KEY" not in data["private_key"])
                  or ("END PRIVATE KEY" not in data["private_key"] and "END RSA PRIVATE KEY" not in data["private_key"])
              ):
                  raise SystemExit("private_key field is present but not in expected PEM format")
              # Convert to PKCS#1 (traditional RSA) to avoid backend parser incompatibility in some Terraform/GCS auth paths.
              with tempfile.NamedTemporaryFile("w", delete=False, suffix=".pem") as src:
                  src.write(data["private_key"])
                  src_path = src.name
              with tempfile.NamedTemporaryFile("w", delete=False, suffix=".pem") as dst:
                  dst_path = dst.name
              try:
                  result = subprocess.run(
                      ["openssl", "rsa", "-traditional", "-in", src_path, "-out", dst_path],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  if result.returncode != 0:
                      # If conversion fails, keep original key material and continue.
                      print(f"Warning: key conversion skipped: {result.stderr.strip()}", file=sys.stderr)
                      dst_path = src_path
                  converted = Path(dst_path).read_text(encoding="utf-8").strip() + "\n"
                  if "BEGIN RSA PRIVATE KEY" in converted:
                      data["private_key"] = converted
              finally:
                  Path(src_path).unlink(missing_ok=True)
                  if dst_path != src_path:
                      Path(dst_path).unlink(missing_ok=True)
              out = Path(os.environ["RUNNER_TEMP"]) / "gcp-sa-key.json"
              out.write_text(json.dumps(data), encoding="utf-8")
              print(f"Credentials file created at: {out} for {data['client_email']}")

          try:
              validate_and_write(raw)
          except Exception as raw_err:
              try:
                  padded = raw + "=" * (-len(raw) % 4)
                  decoded = base64.b64decode(padded).decode("utf-8-sig")
                  validate_and_write(decoded)
              except Exception as b64_err:
                  print("Failed to parse GCP_SA_KEY as raw JSON or base64(JSON).", file=sys.stderr)
                  if raw.startswith("/") or raw.startswith("./"):
                      print("GCP_SA_KEY looks like a file path. Store file CONTENT, not file path.", file=sys.stderr)
                  print(f"Raw JSON parse error: {raw_err}", file=sys.stderr)
                  print(f"Base64 parse error: {b64_err}", file=sys.stderr)
                  raise SystemExit(1)
          PY
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          cred_path = Path(os.environ["RUNNER_TEMP"]) / "gcp-sa-key.json"
          data = json.loads(cred_path.read_text(encoding="utf-8"))
          with tempfile.NamedTemporaryFile("w", delete=False, suffix=".pem") as tmp:
              tmp.write(data["private_key"])
              key_path = tmp.name
          pub = subprocess.check_output(["openssl", "pkey", "-in", key_path, "-pubout"], text=True)
          fp = subprocess.check_output(["openssl", "dgst", "-sha256"], input=pub, text=True).strip()
          print(f"Credential client_email: {data['client_email']}")
          print(f"Credential public key fingerprint: {fp}")
          os.unlink(key_path)
          PY
          echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/gcp-sa-key.json" >> "${GITHUB_ENV}"
      - name: Terraform Init
        shell: bash
        run: |
          set +e
          unset GOOGLE_CREDENTIALS
          unset GOOGLE_BACKEND_CREDENTIALS
          terraform init -input=false -backend-config="credentials=${GOOGLE_APPLICATION_CREDENTIALS}" > tfinit.log 2>&1
          status=$?
          cat tfinit.log
          if [ "${status}" -ne 0 ]; then
            reason="$(grep -m1 -E 'Error:|forbidden|permission|denied|failed' tfinit.log || true)"
            if [ -n "${reason}" ]; then
              echo "::error::Terraform init failed: ${reason}"
            else
              echo "::error::Terraform init failed (see log output above)."
            fi
            exit "${status}"
          fi
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
      - name: Terraform Apply
        if: ${{ github.event.inputs.run_apply == 'true' }}
        run: terraform apply -input=false -auto-approve tfplan
